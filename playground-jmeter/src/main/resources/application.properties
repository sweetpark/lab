spring.application.name=playground-jmeter
server.port=8090

# 기존 lab DB를 재사용한다. 테이블은 ddl-auto=create로 자동 생성된다.
spring.datasource.url=jdbc:mariadb://localhost:3306/lab
# OS 환경변수 또는 IDE Run Configuration의 Environment Variables로 주입한다.
# 예) username=root, password=1234
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# [주의] create: 애플리케이션 기동 시 기존 테이블을 DROP하고 재생성한다.
# 이 모듈은 학습 목적이므로 허용하지만, lab DB를 다른 모듈과 공유하므로
# 다른 모듈 실행 중에는 이 모듈을 동시에 기동하지 않도록 주의한다.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.example.playground.jmeter=DEBUG
